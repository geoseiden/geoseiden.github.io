<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bill and payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #1B1E24; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 56px; padding: 0 8px 0 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 2px">
<a href="Main.dc.html" aria-label="Back to billing" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="font-size: 17px; font-weight: 800">Bill</div>
</div>
<button style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: {{accent}}; font-size: 14px; font-weight: 700">Hold this bill</button>
</div>

<div style="flex-grow: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

<div style="background: #FFFFFF; border-radius: 16px; padding: 4px 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF0F3">
<div style="font-size: 14px; font-weight: 600; flex-grow: 1">Tea</div>
<div style="width: 92px; height: 36px; border: 1px solid #DDE0E6; border-radius: 9px; display: flex; align-items: center; justify-content: space-between; color: {{accent}}; font-weight: 800">
<button aria-label="One less Tea" style="width: 30px; height: 36px; border: 0; background: transparent; color: {{accent}}; font-size: 18px; font-weight: 700">−</button><span style="font-size: 14px">2</span><button aria-label="One more Tea" style="width: 30px; height: 36px; border: 0; background: transparent; color: {{accent}}; font-size: 18px; font-weight: 700">+</button>
</div>
<div style="width: 48px; text-align: right; font-size: 14px; font-weight: 600">₹24</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF0F3">
<div style="font-size: 14px; font-weight: 600; flex-grow: 1">Egg Puffs</div>
<div style="width: 92px; height: 36px; border: 1px solid #DDE0E6; border-radius: 9px; display: flex; align-items: center; justify-content: space-between; color: {{accent}}; font-weight: 800">
<button aria-label="One less Egg Puffs" style="width: 30px; height: 36px; border: 0; background: transparent; color: {{accent}}; font-size: 18px; font-weight: 700">−</button><span style="font-size: 14px">3</span><button aria-label="One more Egg Puffs" style="width: 30px; height: 36px; border: 0; background: transparent; color: {{accent}}; font-size: 18px; font-weight: 700">+</button>
</div>
<div style="width: 48px; text-align: right; font-size: 14px; font-weight: 600">₹60</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0">
<div style="font-size: 14px; font-weight: 600; flex-grow: 1">Chicken Cutlet</div>
<div style="width: 92px; height: 36px; border: 1px solid #DDE0E6; border-radius: 9px; display: flex; align-items: center; justify-content: space-between; color: {{accent}}; font-weight: 800">
<button aria-label="One less Chicken Cutlet" style="width: 30px; height: 36px; border: 0; background: transparent; color: {{accent}}; font-size: 18px; font-weight: 700">−</button><span style="font-size: 14px">1</span><button aria-label="One more Chicken Cutlet" style="width: 30px; height: 36px; border: 0; background: transparent; color: {{accent}}; font-size: 18px; font-weight: 700">+</button>
</div>
<div style="width: 48px; text-align: right; font-size: 14px; font-weight: 600">₹45</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="cname" style="font-size: 12px; font-weight: 600; color: #5E6470">Customer name (optional)</label>
<input id="cname" type="text" style="height: 44px; box-sizing: border-box; border: 1px solid #DDE0E6; border-radius: 12px; padding: 0 12px; font-size: 14px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="cphone" style="font-size: 12px; font-weight: 600; color: #5E6470">Customer phone (optional)</label>
<input id="cphone" type="tel" value="98470 00000" style="height: 44px; box-sizing: border-box; border: 1px solid #DDE0E6; border-radius: 12px; padding: 0 12px; font-size: 14px; background: #FFFFFF">
</div>
</div>

<div style="font-size: 12px; color: #5E6470; line-height: 1.4; padding: 0 2px">Print saves the bill and prints it. The share button makes a PDF of the bill to send through any app. The green WhatsApp button appears only when a phone number is typed.</div>

<div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 800">Bill details</div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #3C424D"><span>Item total</span><span>₹129.00</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #3C424D"><span>Discount</span><button style="height: 32px; padding: 0 10px; border: 1px dashed {{accent}}; border-radius: 8px; background: #FFFFFF; color: {{accent}}; font-size: 13px; font-weight: 700">− ₹4.00</button></div>
<div style="border-top: 1px dashed #D5D9E0; padding-top: 10px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 800"><span>To pay</span><span>₹125</span></div>
</div>

<div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 800">How are they paying?</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button aria-pressed="true" style="height: 44px; border-radius: 10px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 800">Cash</button>
<button aria-pressed="false" style="height: 44px; border-radius: 10px; border: 1px solid #DDE0E6; background: #FFFFFF; color: #3C424D; font-size: 13px; font-weight: 600">UPI</button>
<button aria-pressed="false" style="height: 44px; border-radius: 10px; border: 1px solid #DDE0E6; background: #FFFFFF; color: #3C424D; font-size: 13px; font-weight: 600">Card</button>
</div>
</div>

</div>

<div style="padding: 10px 12px 14px; background: #FFFFFF; border-top: 1px solid #E7E9EE; display: flex; gap: 10px">
<button style="height: 54px; flex: 1 1 0; min-width: 0; border-radius: 14px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v6H7z"></path></svg>Print</button>
<button aria-label="Share the bill as a PDF" style="width: 54px; height: 54px; flex-shrink: 0; border-radius: 14px; border: 1.5px solid #C9CED6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1E24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg></button>
<a href="whatsapp://send?phone=919847000000&amp;text=Your%20bill%20from%20%5BSHOP%20NAME%5D%3A%20Rs.%20125" aria-label="Send the bill on WhatsApp" style="width: 54px; height: 54px; flex-shrink: 0; border-radius: 14px; background: #1FA855; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4.4A8.5 8.5 0 1 1 8 19.3z"></path><path d="M9 8.6c0 3.4 2.9 6.3 6.3 6.3l1-1.6-2-1.1-.9.9a4 4 0 0 1-2.6-2.6l.9-.9-1.1-2z" fill="#FFFFFF" stroke="none"></path></svg></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4D","options":["#1F7A4D","#1D5FBF","#B4470F","#6A3FB5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#1F7A4D' };
}
}
</script>
</body>
</html>
