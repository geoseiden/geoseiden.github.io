<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPI Payment QR Code Generator</title>
    <link rel="stylesheet" href="css/qrstyle.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <h2>UPI Payment QR Code Generator</h2>
        <form id="upi-form" novalidate>
          <div class="field">
            <label for="upiId">UPI ID *</label>
            <input
              type="text"
              id="upiId"
              placeholder="e.g. name@bank"
              maxlength="256"
              autocomplete="off"
              required
            />
            <span class="error-msg" id="upiId-error"></span>
          </div>

          <div class="field">
            <label for="payeeName">Payee Name *</label>
            <input
              type="text"
              id="payeeName"
              placeholder="Enter Payee Name"
              maxlength="100"
              required
            />
            <span class="error-msg" id="payeeName-error"></span>
          </div>

          <div class="field">
            <label for="transactionAmount">Transaction Amount (₹)</label>
            <input
              type="number"
              id="transactionAmount"
              placeholder="Enter Amount (optional)"
              min="0.01"
              max="100000"
              step="0.01"
              inputmode="decimal"
            />
            <span class="error-msg" id="transactionAmount-error"></span>
          </div>

          <div class="field">
            <label for="paymentNote">Payment Message/Note</label>
            <input
              type="text"
              id="paymentNote"
              placeholder="Enter Payment Note (optional)"
              maxlength="50"
            />
            <span class="error-msg" id="paymentNote-error"></span>
          </div>
        </form>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
        <button id="download-btn" onclick="downloadQRCode()">
          Download QR Code
        </button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/qrscript.js"></script>
  </body>
</html>
