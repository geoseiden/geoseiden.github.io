<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Resume Prompt Builder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    // set theme before first paint to avoid a flash of the wrong mode
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* ---------- tokens (thegeorge.in design system) ---------- */
    :root {
      --main: #76fbd9;
      --bg: #ffffff;
      --text: #000000;
      --card-bg: #ffffff;
      --accent: #2b55ff;
      --yellow: #fde047;
      --blue: #60a5fa;
      --green: #4ade80;
      --shadow: #000000;
      --page-bg: #f4f4f5;
      --grid-line: #e4e4e7;
      --muted: #52525b;
      --field-bg: #fafafa;
      --radius: 5px;
      color-scheme: light;
    }
    html.dark {
      --bg: #212121;
      --text: #eeefe9;
      --card-bg: #2a2a2a;
      --accent: #4b6fff;
      --shadow: #555555;
      --page-bg: #171717;
      --grid-line: #303030;
      --muted: #a1a1aa;
      --field-bg: #1b1b1b;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      line-height: 1.6;
      color: var(--text);
      background-color: var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    ::selection { background: var(--main); color: #000; }

    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- card ---------- */
    .card {
      position: relative;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 3px solid #000;
      border-radius: var(--radius);
      box-shadow: 12px 12px 0 0 var(--shadow);
      padding: 32px;
    }

    /* grid-paper backdrop inside the card, faded at the edges */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      border-radius: var(--radius);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 20px 20px;
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 40%, transparent 100%);
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 40%, transparent 100%);
    }
    .card > * { position: relative; z-index: 1; }

    /* ---------- header ---------- */
    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .title-banner {
      flex: 1;
      padding: 1rem 1.5rem;
      text-align: center;
      color: #000;
      background: var(--main);
      border: 3px solid #000;
      border-radius: var(--radius);
      box-shadow: 8px 8px 0 0 var(--shadow);
    }
    .title-banner h1 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
    }
    .title-banner .subtitle {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #000;
    }

    .theme-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      font-size: 1.15rem;
      color: var(--text);
      background: var(--card-bg);
      border: 2px solid #000;
      border-radius: var(--radius);
      box-shadow: 4px 4px 0 0 var(--shadow);
      cursor: pointer;
      transition: all 0.3s;
    }
    .theme-btn:hover {
      transform: translateY(-4px);
      box-shadow: 6px 6px 0 0 var(--shadow);
    }

    /* ---------- textarea ---------- */
    textarea {
      width: 100%;
      min-height: 480px;
      background: var(--field-bg);
      border: 3px solid #000;
      border-radius: var(--radius);
      box-shadow: 6px 6px 0 0 var(--shadow);
      padding: 16px;
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      outline: none;
      resize: vertical;
    }
    textarea:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- buttons ---------- */
    .controls {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: #000;
      text-decoration: none;
      background: var(--main);
      border: 2px solid #000;
      border-radius: var(--radius);
      box-shadow: 4px 4px 0 0 var(--shadow);
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 8px 8px 0 0 var(--shadow);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow: 2px 2px 0 0 var(--shadow);
    }

    .btn-yellow { background: var(--yellow); }
    .btn-blue   { background: var(--blue); }
    .btn-green  { background: var(--green); }

    .copy-btn {
      font-size: 1.1rem;
      padding: 0.75rem 1.5rem;
    }
    .copy-btn.copied { background: var(--green); }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footnote {
      margin-top: 20px;
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
    }
    .footnote .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: #000;
      background: var(--yellow);
      border: 2px solid #000;
      border-radius: var(--radius);
      margin-right: 6px;
      vertical-align: middle;
    }

    @media (max-width: 560px) {
      .card { padding: 20px; box-shadow: 8px 8px 0 0 var(--shadow); }
      .controls { justify-content: center; }
      .copy-btn { width: 100%; }
      .links { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="head">
      <div class="title-banner">
        <h1>Developer Resume Prompt Builder</h1>
        <div class="subtitle">
          Fill the template, copy it, and paste into your favorite AI to generate a clean LaTeX resume.
        </div>
      </div>
      <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme">🌙</button>
    </div>

    <textarea id="prompt" spellcheck="false"></textarea>

    <div class="controls">
      <button class="btn copy-btn" id="copy-btn" onclick="copyPrompt()">
        Copy Prompt
      </button>

      <div class="links">
        <a class="btn btn-green"  href="https://www.overleaf.com" target="_blank" rel="noopener">Overleaf</a>
        <a class="btn btn-yellow" href="https://chat.openai.com" target="_blank" rel="noopener">ChatGPT</a>
        <a class="btn btn-blue"   href="https://claude.ai" target="_blank" rel="noopener">Claude</a>
        <a class="btn"            href="https://gemini.google.com" target="_blank" rel="noopener">Gemini</a>
      </div>
    </div>

    <div class="footnote">
      <span class="badge">TIP</span>
      Paste your details after <strong>USER INPUT:</strong> at the bottom of the prompt before copying.
    </div>

  </div>

  <script>
    const templatePrompt = `You are an expert LaTeX resume generator specializing in clean, minimal, ATS-friendly developer resumes.

Your task is to generate COMPLETE, READY-TO-COMPILE LaTeX code in code format suitable for Overleaf.

Return ONLY the LaTeX code.
Do NOT explain anything.
Do NOT add commentary before or after the code.

--------------------------------------------------

CRITICAL DESIGN RULES:

• Keep the layout modern, minimal, and highly readable.
• Prefer a single-column structure.
• Avoid excessive styling, colors, graphics, tables, or boxes.
• Ensure strong spacing and visual hierarchy.
• Resume should ideally fit on ONE page unless the candidate is highly experienced.

--------------------------------------------------

HEADER REQUIREMENTS (VERY IMPORTANT):

Use FontAwesome icons with clickable \\href links for ALL contact items.

Ensure the FontAwesome package is included so icons compile correctly.

Follow this EXACT formatting style:

\\href{URL}{\\raisebox{-0.05\\height}\\faIcon\\ DisplayText}

Example pattern:

\\href{https://github.com/username}{\\raisebox{-0.05\\height}\\faGithub\\ username}
\\ $|$ \\
\\href{mailto:user@email.com}{\\raisebox{-0.05\\height}\\faEnvelope\\ user@email.com}

RULES:

• Separate each link using:  \\ $|$ \\
• Do NOT show labels like “GitHub:” or “Email:”.
• Do NOT output raw URLs.
• Always use icons.
• Keep everything on ONE centered line beneath the name.
• Omit any field that is not provided.

--------------------------------------------------

CONTENT STRATEGY:

Focus on SIGNAL, not noise.

Recruiters should immediately see technical strength.

Remove weak or low-value content automatically, such as:

• workshop attendance
• basic coursework
• outdated school achievements
• generic objectives

Prioritize:

✔ Projects
✔ Real-world experience
✔ Internships
✔ Technical impact
✔ Demonstrated ownership

--------------------------------------------------

SECTION RULES (Use only if data exists):

• Professional Summary → ONLY include if it is genuinely strong.
• Education
• Experience
• Projects  ⭐ HIGH PRIORITY FOR DEVELOPERS
• Skills / Technologies

Do NOT create empty sections.

--------------------------------------------------

WRITING BULLETS:

Transform weak statements into high-impact bullets.

GOOD:
“Implemented OAuth authentication improving login security.”

BAD:
“Responsible for authentication.”

Use strong action verbs such as:
Developed, Engineered, Built, Optimized, Implemented, Designed.

Each role/project should contain **2–4 bullets MAX**.

No paragraphs.

No fluff.

No buzzwords.

--------------------------------------------------

PROJECT FORMATTING:

For each project include:

• Title
• Tech stack
• GitHub (if available)
• 2–4 impact-driven bullets

Emphasize:

• What was built
• Technologies used
• Performance improvements
• Real-world application

If many projects are provided, prioritize the strongest.

--------------------------------------------------

SKILLS SECTION:

Group clearly:

Languages:
Frameworks:
Tools:
Databases:
Concepts:

Avoid dumping everything into one long line.

--------------------------------------------------

SMART IMPROVEMENTS (Allowed):

✔ Rewrite bullets for clarity
✔ Fix grammar
✔ Improve phrasing
✔ Merge redundant content

--------------------------------------------------

STRICTLY FORBIDDEN:

✘ Do NOT invent experience
✘ Do NOT fabricate metrics
✘ Do NOT hallucinate projects

If important data is missing, insert placeholders like:

[Add GitHub]
[Insert GPA]
[Add Dates]

--------------------------------------------------

FINAL OUTPUT RULE:

Return ONLY the complete LaTeX code.
No explanations.
No markdown.
No commentary.

--------------------------------------------------

USER INPUT:`;

    const textarea = document.getElementById("prompt");
    textarea.value = templatePrompt;

    // theme toggle, persisted like thegeorge.in
    const themeBtn = document.getElementById("theme-toggle");
    function paintThemeBtn() {
      themeBtn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
    }
    function toggleTheme() {
      const dark = document.documentElement.classList.toggle("dark");
      try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      paintThemeBtn();
    }
    paintThemeBtn();

    async function copyPrompt() {
      const btn = document.getElementById("copy-btn");
      try {
        await navigator.clipboard.writeText(textarea.value);
      } catch {
        textarea.select();
        document.execCommand("copy");
      }
      btn.textContent = "Copied! ✔";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Copy Prompt";
        btn.classList.remove("copied");
      }, 1600);
    }
  </script>

</body>
</html>
